<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Resume — Your Name</title>
    <style>
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji",
          "Segoe UI Emoji";
        margin: 0;
        padding: 32px;
        line-height: 1.6;
        background: #0b1020;
        color: rgba(255, 255, 255, 0.92);
      }
      .card {
        max-width: 900px;
        margin: 0 auto;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 18px;
        padding: 22px;
        background: rgba(255, 255, 255, 0.06);
      }
      h1 {
        margin: 0 0 10px;
      }
      p {
        color: rgba(255, 255, 255, 0.72);
      }
      code {
        background: rgba(255, 255, 255, 0.08);
        padding: 2px 8px;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Resume placeholder</h1>
      <p>
        Replace this file with your real resume (PDF export), or keep it as a simple HTML resume.
      </p>
      <p>
        Tip: If you prefer a PDF, create <code>assets/resume.pdf</code> and update the link in
        <code>index.html</code>.
      </p>
    </div>
  </body>
</html>
